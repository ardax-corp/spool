[package]
name = "spool"
version = "0.2.0"

[module]
roots = ["./src"]

# spool is a standalone binary: ./bootstrap.sh packages spool.hy.
[entry]
file = "spool.hy"

[env]
allow_exit = true

[permissions]
read = true
write = true
env = true
# spool runs git, cc and coil with the built-in `process` module.
exec = true

[dependencies]
# There is no global stdlib: spool builds against this pin (bootstrap.sh too).
stdlib = { git = "https://github.com/ardax-corp/coil-stdlib.git", rev = "edf4e26572d2962daee0a3b691b3c7b4979900c4" }
# coil-toml has no release tags yet; pin a commit that builds without prelude::math floats (coil-toml#13).
toml = { git = "https://github.com/ardax-corp/coil-toml.git", rev = "5a78481a2ac2fee18f0738b3fc88b43e44b20c2b" }
# Read API (get/at/as_*) for coil test/mutate --json events: ardax-corp/coil-json#10.
json = { git = "https://github.com/ardax-corp/coil-json.git", rev = "b39175852e270c0bd3cd0c0a48b50de0b08c9f61" }
