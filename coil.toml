[package]
name = "spool"
version = "0.2.0"

[module]
roots = ["./src"]

# spool is a standalone binary: ./bootstrap.sh packages spool.hy.
[entry]
file = "spool.hy"

[env]
allow_exec = true
allow_exit = true

[permissions]
read = true
write = true
env = true

[dependencies]
# coil-toml has no release tags yet; pin the commit with the pub-API fix (COI-392).
toml = { git = "https://github.com/ardax-corp/coil-toml.git", rev = "3e0da9d38f0fb0d090f56869e2547fa2bebd8453" }
# Read API (get/at/as_*) for coil test/mutate --json events: ardax-corp/coil-json#10.
json = { git = "https://github.com/ardax-corp/coil-json.git", rev = "50d521698a1dd0bb6ec604a5cd24238c737f4f14" }
