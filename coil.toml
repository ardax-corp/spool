[package]
name = "spool"
version = "0.1.0"

[module]
# Sibling checkouts for local development.
# Override roots if your layout differs.
roots = ["./src", "../coil-stdlib/src", "../coil-toml/src"]

# No [entry]: running the same path as [entry].file breaks `extern "c"`
# (invalid library handle). Always invoke via ./spool or `coil spool.hy`.

[env]
allow_exec = true
