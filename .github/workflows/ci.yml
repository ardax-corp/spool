name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libffi-dev libpcre2-dev build-essential

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache coil build
        uses: actions/cache@v4
        with:
          path: .bootstrap/coil-lang/target
          key: coil-${{ runner.os }}-${{ hashFiles('bootstrap.sh') }}
          restore-keys: coil-${{ runner.os }}-

      # Finds a valid coil (none on the runner, no release yet), builds
      # coil-lang main from source, then packages target/spool.
      - name: Bootstrap spool
        run: ./bootstrap.sh

      - name: Environment
        run: |
          echo "COIL=$PWD/.bootstrap/coil-lang/target/release/coil" >> "$GITHUB_ENV"
          echo "COIL_STDLIB_DIR=$PWD/.bootstrap/coil-stdlib" >> "$GITHUB_ENV"

      - name: Doctor
        run: ./target/spool doctor

      - name: Unit tests
        run: |
          ./target/spool install --locked
          ./target/spool test

      - name: Smoke tests
        run: ./scripts/smoke_all.sh
