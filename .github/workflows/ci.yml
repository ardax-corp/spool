name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to a pull request cancels that PR's older runs. Runs on the
# default branch are never cancelled once started.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libffi-dev libpcre2-dev build-essential

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache coil build
        uses: actions/cache@v4
        with:
          path: .bootstrap/coil-lang/target
          key: coil-${{ runner.os }}-${{ hashFiles('bootstrap.sh') }}
          restore-keys: coil-${{ runner.os }}-

      # coil comes from the coil-lang `edge` release (a snapshot of its main,
      # rebuilt after every green coil-lang CI run). Only when that release is
      # unavailable does bootstrap build coil-lang main from source, which is
      # what the Rust toolchain and the cache above are for.
      - name: Find coil (edge)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          coil="$(./bootstrap.sh --channel edge --coil-only)"
          echo "COIL=$coil" >> "$GITHUB_ENV"

      # Packages target/spool with that coil ($COIL is tried first).
      - name: Bootstrap spool
        run: ./bootstrap.sh

      - name: Environment
        run: echo "COIL_STDLIB_DIR=$PWD/.bootstrap/coil-stdlib" >> "$GITHUB_ENV"

      - name: Doctor
        run: ./target/spool doctor

      - name: Unit tests
        run: |
          ./target/spool install --locked
          ./target/spool test

      - name: Smoke tests
        run: ./scripts/smoke_all.sh

  # The musl build edge.yml publishes, inside Alpine (JavaScript actions
  # cannot run in an Alpine job container): coil from its musl archive.
  musl:
    name: build (x86_64-unknown-linux-musl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap spool (Alpine)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          docker run --rm -e GITHUB_TOKEN -v "$PWD":/src -w /src alpine:3.20 sh -c '
            set -eu
            apk add --no-cache bash build-base curl git libffi pcre2-dev tar
            git config --global --add safe.directory "*"
            # As in the gnu job: doctor needs coil and the stdlib bootstrap fetched.
            export COIL="$(./bootstrap.sh --channel edge --coil-only)"
            ./bootstrap.sh
            export COIL_STDLIB_DIR="$PWD/.bootstrap/coil-stdlib"
            ./target/spool --version
            ./target/spool doctor
            # spool setup picks the musl coil archive (spool#63).
            COIL_HOME=/tmp/coil-home ./target/spool setup --channel edge --coil-only
            /tmp/coil-home/bin/coil --version
          '
