name: Edge

# One rolling pre-release, `edge`, with a spool binary per host. It is
# rebuilt after every green CI run on main: the `edge` tag moves to that
# commit and every asset is replaced. A pushed v* tag builds the same
# archives for a release of its own.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]
  workflow_dispatch:

# A newer main build supersedes one still running; each tag builds once.
concurrency:
  group: ${{ github.ref_type == 'tag' && github.ref || 'edge' }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # The CI run's commit (workflow_run), or the dispatched ref's.
  EDGE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  # coil-lang release spool is built with. Tagged builds too: coil-lang has
  # no tagged release yet.
  COIL_CHANNEL: edge

jobs:
  build:
    name: spool (${{ matrix.triple }})
    # Only pushes to main: a pull request whose head branch is named `main`
    # also reports branch `main` here.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            triple: aarch64-unknown-linux-gnu
          - os: macos-latest
            triple: aarch64-apple-darwin
          # Built inside Alpine with coil's own musl archive.
          - os: ubuntu-latest
            triple: x86_64-unknown-linux-musl
            musl: true
          # x86_64-apple-darwin: GitHub's Intel macOS runners queue for hours
          # (coil-lang COI-100); coil-lang publishes no such build either.
          # Windows: spool needs a POSIX `sh`.
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EDGE_SHA }}

      - name: Install system deps (Linux)
        if: runner.os == 'Linux' && !matrix.musl
        run: |
          sudo apt-get update
          sudo apt-get install -y libffi-dev libpcre2-dev build-essential

      - name: Install system deps (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install libffi pcre2 pkg-config
          pkg-config --exists libffi

      - uses: dtolnay/rust-toolchain@stable
        if: ${{ !matrix.musl }}

      - name: Check host triple
        if: ${{ !matrix.musl }}
        run: |
          host="$(rustc -vV | sed -n 's/^host: //p')"
          if [[ "$host" != "${{ matrix.triple }}" ]]; then
            echo "::error::runner host '$host' is not ${{ matrix.triple }}"
            exit 1
          fi

      - name: Cache coil build
        if: ${{ !matrix.musl }}
        uses: actions/cache@v4
        with:
          path: .bootstrap/coil-lang/target
          key: edge-coil-${{ matrix.triple }}-${{ hashFiles('bootstrap.sh') }}
          restore-keys: edge-coil-${{ matrix.triple }}-

      # coil comes from the coil-lang `edge` release; the source build (and the
      # Rust toolchain and cache above) is only the fallback.
      - name: Bootstrap spool
        if: ${{ !matrix.musl }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./bootstrap.sh --channel "$COIL_CHANNEL"

      # JavaScript actions cannot run in an Alpine job container, so the
      # musl build runs in one by hand. coil comes from its musl archive.
      - name: Bootstrap spool (musl / Alpine)
        if: ${{ matrix.musl }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          docker run --rm -e GITHUB_TOKEN -e COIL_CHANNEL -v "$PWD":/src -w /src alpine:3.20 sh -c '
            set -eu
            apk add --no-cache bash build-base curl git libffi pcre2-dev tar
            git config --global --add safe.directory "*"
            ./bootstrap.sh --channel "$COIL_CHANNEL"
            ./target/spool --version
          '
          sudo chown -R "$(id -u):$(id -g)" .

      - name: Smoke check
        if: ${{ !matrix.musl }}
        run: ./target/spool --version

      - name: Package
        run: |
          mkdir -p dist
          archive="spool-${{ matrix.triple }}.tar.gz"
          tar -C target -czf "dist/$archive" spool
          (cd dist && shasum -a 256 "$archive" > "$archive.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: edge-${{ matrix.triple }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EDGE_SHA }}

      - uses: actions/download-artifact@v4
        with:
          pattern: edge-*
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cat dist/*.sha256 > dist/SHA256SUMS
          rm dist/*.sha256
          cat dist/SHA256SUMS

      - name: Move the edge tag
        if: github.ref_type != 'tag'
        run: |
          git tag -f edge "$EDGE_SHA"
          git push -f origin refs/tags/edge

      - name: Update the edge release
        if: github.ref_type != 'tag'
        run: |
          notes="Rolling pre-release of spool, rebuilt from main after every green CI run.

          Commit: ${EDGE_SHA}
          Built: $(date -u '+%Y-%m-%d %H:%M UTC')

          Not a stable release: the binaries and this tag are replaced on every build.
          Each archive holds a single \`spool\` executable; \`SHA256SUMS\` lists their checksums."
          if gh release view edge >/dev/null 2>&1; then
            gh release edit edge --prerelease --title "edge" --notes "$notes"
          else
            gh release create edge --prerelease --verify-tag --title "edge" --notes "$notes"
          fi
          gh release upload edge dist/* --clobber
          # Drop assets this build did not produce (e.g. a removed target).
          gh release view edge --json assets -q '.assets[].name' | while read -r name; do
            if [[ ! -e "dist/$name" ]]; then
              gh release delete-asset edge "$name" --yes
            fi
          done

      - name: Publish the tagged release
        if: github.ref_type == 'tag'
        run: |
          tag="$GITHUB_REF_NAME"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --verify-tag --title "$tag" \
              --notes "spool $tag. Each archive holds a single \`spool\` executable; \`SHA256SUMS\` lists their checksums."
          fi
          gh release upload "$tag" dist/* --clobber
